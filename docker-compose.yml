services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planner_fin_local
      POSTGRES_USER: planner_fin_local
      POSTGRES_PASSWORD: planner_fin_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - planner_fin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner_fin_local -d planner_fin_local']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  planner_fin_postgres_data:
